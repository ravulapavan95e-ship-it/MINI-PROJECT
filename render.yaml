services:
  - type: web
    name: personalized-learning-assistant
    runtime: python
    plan: free
    buildCommand: python -m pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://mini-project-1-sexl.onrender.com
